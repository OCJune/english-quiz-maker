name: Build installers

# Tag a release (e.g. v0.1.0) to get installers for both platforms, or run this
# manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            package: npm run package:win
          - os: macos-latest
            name: macos
            package: npm run package:mac

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Checks run against the built bundle with a console-attached Electron.
      # A packaged Windows app is a GUI binary and prints nothing to the terminal,
      # so this is the form that reports failures in CI. xvfb gives Linux a display;
      # Windows and macOS runners already have one.
      - name: Build bundles
        run: node scripts/build.mjs

      - name: Engine self-test
        run: npx electron out/main/index.js --self-test --report selftest.txt
      - name: Show self-test report
        if: always()
        run: cat selftest.txt
        shell: bash

      - name: Bundled fonts
        run: npx electron out/main/index.js --font-check --report fontcheck.txt
      - name: Show font report
        if: always()
        run: cat fontcheck.txt
        shell: bash

      - name: Package
        run: ${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: ariaforge-${{ matrix.name }}
          path: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.zip
          if-no-files-found: error
          retention-days: 14

      # On a tag, attach the installers to a GitHub Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/*.exe
            app/release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
